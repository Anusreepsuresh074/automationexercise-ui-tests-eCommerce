[project]
name = "automationexercise-ui-tests"
version = "1.0.0"
description = "Playwright (Python) + pytest UI test automation for automationexercise.com, built on the Page Object Model"
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --alluredir=reports/allure-results --reruns 2 --reruns-delay 5"
log_level = "INFO"
log_format = "%(asctime)s %(levelname)-7s %(name)s: %(message)s"
log_date_format = "%H:%M:%S"
markers = [
    "smoke: quick, high-value checks run on every push",
    "sanity: broader pass covering core flows",
    "regression: full suite, all designed test cases",
    "p0: highest priority",
    "p1: standard priority",
    "login: login/logout flow",
    "signup: account signup flow",
    "products: product listing, search, filter",
    "product_details: single product view, add to cart, reviews",
    "cart: shopping cart contents",
    "checkout: checkout, payment, order confirmation",
    "account: account management (delete, profile)",
    "contact_us: contact us form",
    "nav: global navigation smoke coverage",
    "accessibility: automated axe-core WCAG scans",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".claude", "context"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "conftest.py"]
exclude = ["^\\.claude/", "^context/"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Libraries that ship without type hints
module = ["allure.*", "axe_playwright_python.*", "yaml"]
ignore_missing_imports = true
