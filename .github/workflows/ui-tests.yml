name: UI Tests

on:
  # Fast feedback: smoke on Chromium for every push / PR to main.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Full regression across all browsers, nightly and on demand.
  schedule:
    - cron: "30 1 * * *"  # 01:30 UTC daily
  workflow_dispatch:

# Smoke and regression runs get separate groups, so a push never cancels a
# nightly regression (and the report it publishes) that is still running.
concurrency:
  group: ui-tests-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'regression' || 'smoke' }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  ui-tests:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write  # publish the JUnit test summary
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request') && '["chromium"]' || '["chromium","firefox","webkit"]') }}
    env:
      TEST_ENV: prod
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}
      MARKER: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'smoke' || 'regression' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps ${{ matrix.browser }}

      # Every test runs in its own browser context, so they're safe to
      # run in parallel across workers.
      - name: Run ${{ env.MARKER }} tests on ${{ matrix.browser }}
        run: pytest -m "$MARKER" --browser=${{ matrix.browser }} -n 4 --junitxml=reports/junit.xml

      - name: Test summary
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: reports/junit.xml
          check_name: Test results (${{ matrix.browser }})
          detailed_summary: true
          include_passed: false

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.browser }}
          path: reports/allure-results/
          retention-days: 14

      - name: Upload Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: reports/traces/
          retention-days: 14

  # Merges every browser's results into one Allure report, keeps run-over-run
  # history (trend graphs), and publishes it to GitHub Pages (gh-pages branch).
  # Only for the full regression (nightly / manual), so a push's smoke run
  # never replaces the published report; smoke results stay downloadable as
  # the run's allure-results-* artifacts. One-time repo setup: Settings →
  # Pages → Deploy from branch → gh-pages.
  allure-report:
    needs: ui-tests
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all browsers' Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Fetch previous report (for history)
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # Each browser's results carry their own environment file and only one
      # survives the merge, so list every browser this run covered.
      - name: List all tested browsers in the report's Environment panel
        run: sed -i "s/^Browser=.*/Browser=chromium, firefox, webkit/" allure-results/environment.properties

      - name: Generate Allure report
        run: |
          if [ -d gh-pages/history ]; then cp -r gh-pages/history allure-results/; fi
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
